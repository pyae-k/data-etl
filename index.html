    <!--
      Base-path detection (ported from pwa_duckdb/config.js). Runs as a classic
      script before the module so that the same build works at any deploy path,
      including GitHub Pages subpaths like /<repo>/. Sets window.__APP_BASE__ and
      injects a <base> tag so relative asset URLs resolve correctly. Skipped on
      file:// (Safari breaks relative scripts under <base> on file:).
    -->
    <script>
      (function () {
        try {
          var l = window.location;
          var override = window.__APP_BASE_OVERRIDE__;
          var base = override
            ? override
            : l.protocol === "file:"
            ? l.href.replace(/[^/]*$/, "")
            : l.pathname && l.pathname !== "/"
            ? l.pathname.replace(/[^/]*$/, "") || "/"
            : "/";
          if (!base.endsWith("/")) base += "/";
          window.__APP_BASE__ = base;
          if (l.protocol !== "file:") {
            var b = document.createElement("base");
            b.href = base;
            document.head.appendChild(b);
          }
        } catch (e) {
          window.__APP_BASE__ = "/";
        }
      })();
    </script>

  <style>
    /* ETL app full-screen layout override
       The Vite bundle sizes .app-shell to 100vh, but the shared root stylesheet
       wraps the React mount in a flex <main> with a footer below it. This override
       makes the shell fill the <main> area instead of the viewport so the footer
       stays visible and nothing is clipped. Structural sizing only — no tokens. */
    html, body { height: 100%; }
    body { overflow: hidden; display: flex; flex-direction: column; }
    #main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0;
      gap: 0;
      display: flex;
      flex-direction: column;
    }
    #root {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }
    #root > .app-shell {
      height: 100% !important;
      min-height: 0;
    }
    footer { flex-shrink: 0; }

    <script>
    // Theme toggle for ETL app header
    (function() {
      var toggle = document.getElementById('btn-theme-etl');
      if (toggle) {
        var icon = toggle.querySelector('svg');
        var html = document.documentElement;
        function updateToggle(theme) {
          var isDark = theme === 'dark';
          toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          toggle.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          if (icon) {
            icon.innerHTML = isDark
              ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
              : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
          }
        }
        updateToggle(html.getAttribute('data-theme') || 'light');
        toggle.addEventListener('click', function() {
          var current = html.getAttribute('data-theme') || 'light';
          var next = current === 'dark' ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateToggle(next);
        });
      }
    })();
    </script>
    <script>
    // Place the theme toggle button in the app header between AI and "..." buttons
    (function() {
      var btn = document.getElementById('btn-theme-etl');
      if (!btn) return;
      var placed = false;
      function place() {
        if (placed) return;
        var header = document.querySelector('.app-header');
        if (!header) { setTimeout(place, 200); return; }
        var stepsBtn = header.querySelector('button[title="Toggle Steps"]');
        if (!stepsBtn) { setTimeout(place, 200); return; }
        header.insertBefore(btn, stepsBtn);
        btn.style.display = 'inline-flex';
        placed = true;
      }
      // Try immediately and on mutation (app may re-render)
      place();
      var observer = new MutationObserver(function() {
        if (!placed || !document.body.contains(btn)) {
          placed = false;
          place();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
